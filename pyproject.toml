[build-system]
requires = ["setuptools>=40.8.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "benchpred"
authors = [
    {name = "Guanhua Zhang"},
]
description = "Minimal benchmark-prediction toolkit centred on mRMR coreset selection."
version = "1.0.0"
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy<2",
    "scipy",
    "scikit-learn",
    "pandas",
    "matplotlib",
    "joblib",
    "tqdm",
    "datasets",
    "requests",
    "torch",
    "pyro-ppl",
    "pyyaml",
    "pydantic",
    "kmedoids",
    "pygam",
    "gitpython",
    "ipython",
    "ipykernel>=6.29.5",
    "jupyterlab",
    "nbconvert",
]

[project.optional-dependencies]
# DKPS method (response-based, HELM only). Kept optional so core installs are
# unaffected; benchpred guards the import and skips registering 'dkps' /
# 'dkps_google' if these are missing. graspologic must be compatible with the
# numpy<2 pin above -- verify the resolved version imports cleanly before relying
# on it. google-genai is only needed for the 'dkps_google' (free-text) embedder.
dkps = [
    "graspologic",
    "google-genai",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["benchpred*", "zarth_utils*"]
